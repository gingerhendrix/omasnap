name: Build Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  archlinux:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    # The job runs in the image from container/Dockerfile through the same
    # make targets as a local `make docker-check`. Packages live there.

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the container image
        run: make docker-image DOCKER_BUILD_FLAGS=--pull

      - name: Check installer scripts
        run: make docker-run CMD='bash -n install-arch'

      - name: Build, run interaction smoke, and analyze sources
        run: make docker-check DOCKER_BUILD_DIR=build

      - name: Stage installation
        run: make docker-run CMD='cmake --install build --prefix /src/stage/usr'

      - name: Package Linux artifact
        run: |
          make docker-run CMD="sh -c 'QT_QPA_PLATFORM=offscreen ./build/omasnap --version >build/version.txt'"
          version="$(cut -d' ' -f2 build/version.txt)"
          archive="omasnap-${version}-archlinux-x86_64.tar.gz"
          echo "CAPTURE_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT=${archive%.tar.gz}" >> "$GITHUB_ENV"
          tar -C stage -czf "$archive" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT }}
          path: ${{ env.CAPTURE_ARCHIVE }}
          if-no-files-found: error

      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAPTURE_ARCHIVE }}
